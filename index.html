<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>IdeaBox</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="hero">
      <div class="badge">MINI SAAS</div>

      <h1>IdeaBox</h1>

      <p class="subtitle">
        Salva, organizza e porta avanti le tue idee.
      </p>
    </section>

    <section class="card">
      <form id="ideaForm">
        <label for="ideaInput">Nuova idea</label>

        <div class="input-row">
          <input
            id="ideaInput"
            type="text"
            placeholder="Es. Creare una newsletter..."
            autocomplete="off"
            required
          />

          <button type="submit">
            Aggiungi
          </button>
        </div>
      </form>
    </section>

    <section class="stats">
      <div class="stat">
        <span id="totalIdeas">0</span>
        <small>Idee totali</small>
      </div>

      <div class="stat">
        <span id="completedIdeas">0</span>
        <small>Completate</small>
      </div>

      <div class="stat">
        <span id="activeIdeas">0</span>
        <small>Da fare</small>
      </div>
    </section>

    <section class="ideas-section">
      <div class="section-header">
        <h2>Le tue idee</h2>

        <button
          id="clearCompleted"
          class="secondary-button"
          type="button"
        >
          Elimina completate
        </button>
      </div>

      <div id="emptyState" class="empty-state">
        <div class="empty-icon">💡</div>
        <h3>Nessuna idea ancora</h3>
        <p>Inserisci la tua prima idea qui sopra.</p>
      </div>

      <div id="ideasList" class="ideas-list"></div>
    </section>
  </main>

  <footer>
    IdeaBox · Primo test ChatGPT → GitHub → Replit
  </footer>

  <script src="script.js"></script>
</body>
</html>
